name: Cucumber CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Branded Browser and System Deps
        # CRITICAL: We install 'chrome' system-wide so 'channel: chromium' works on Linux,
        # and include system dependencies (--with-deps) for video/rendering libraries.
        run: npx playwright install --with-deps chromium

      - name: Run Cucumber tests
        continue-on-error: true
        # CRITICAL: Running via xvfb-run wraps the execution inside a virtual monitor layout,
        # which satisfies the browser's anti-bot canvas checks on headless Linux servers.
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" npm run serviceNSW

      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: |
            reports/
            !reports/*.json
          if-no-files-found: warn
