name: Cucumber CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cucumber tests
        run: npx cucumber-js --require-module ts-node/register --require "src/step-definitions/**/*.ts" "src/features/**/*.feature" --format json:reports/cucumber-report.json && node generate-cucumber-report.js

      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: reports/cucumber-report.html
          if-no-files-found: error
